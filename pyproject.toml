[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emb2face"
version = "0.1.0"
description = "Emb2Face training and inversion attack pipelines"
requires-python = ">=3.8"

[project.scripts]
emb2face = "emb2face.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
